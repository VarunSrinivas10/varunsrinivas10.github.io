<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Varun S. Venkatesh</title>
  <meta name="description" content="PhD candidate in Materials Science & Engineering at the University of Michigan."/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="assets/css/style.css"/>
</head>
<body>
<div id="app">
  <div id="graph-side">
    <canvas id="graph-canvas"></canvas>
    <button id="back-btn">← overview</button>
    <span id="graph-label"></span>
  </div>
  <div id="content-side">
    <div id="content-inner">
      <div id="view-home"></div>
      <div id="view-section" style="display:none"></div>
    </div>
  </div>
</div>

<div id="tooltip"></div>

<!-- Lightbox for gallery images -->
<div id="lightbox">
  <img id="lightbox-img" src="" alt=""/>
</div>

<script src="assets/js/data.js"></script>
<script src="assets/js/graph.js"></script>
<script src="assets/js/ui.js"></script>
<script>
  UI.init();

  // Gallery image lightbox
  document.addEventListener('click', function(e) {
    if (e.target.classList.contains('gallery-img')) {
      document.getElementById('lightbox-img').src = e.target.src;
      document.getElementById('lightbox').classList.add('open');
    }
  });
  document.getElementById('lightbox').addEventListener('click', function() {
    document.getElementById('lightbox').classList.remove('open');
  });
</script>
</body>
</html>
